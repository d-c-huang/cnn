name: zhiwei-ai-lab

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PORT:-8080}:8000"
    volumes:
      - mnist-data:/app/data
      - mnist-runs:/app/runs
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  mnist-data:
  mnist-runs:
